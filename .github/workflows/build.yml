name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # Host-side tests for the kernel-independent units (tests/). These need
  # only the host compiler and the Linux UAPI headers.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: make -C tests check

  # Cross-compile the module against the same kernel the image ships:
  # linux-fslc 6.12 with the Glowforge BSP overlay (EPIT/SDMA API
  # patches + config fragment) from meta-openglow, mirroring the
  # recipe's KCFLAGS=-Werror. Compile coverage only - runtime
  # validation happens on the bench image.
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: module

      - name: Cross toolchain + kbuild prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabihf flex bison bc libssl-dev

      - name: Fetch linux-fslc 6.12
        uses: actions/checkout@v4
        with:
          repository: Freescale/linux-fslc
          ref: 6.12.x+fslc
          path: kernel
          fetch-depth: 1

      - name: Fetch the Glowforge BSP overlay
        uses: actions/checkout@v4
        with:
          repository: openglow-org/meta-openglow
          ref: scarthgap
          path: meta-openglow
          fetch-depth: 1

      - name: Overlay + patch the kernel
        run: |
          BSP=meta-openglow/meta-glowforge-bsp/recipes-kernel/linux/linux-fslc
          cp -r "$BSP/git/." kernel/
          cd kernel
          for p in "../$BSP"/0*.patch; do
            patch -p1 < "$p"
          done

      - name: Configure (imx_v6_v7 + glowforge fragment) and modules_prepare
        run: |
          cd kernel
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- imx_v6_v7_defconfig
          ./scripts/kconfig/merge_config.sh -m .config \
            ../meta-openglow/meta-glowforge-bsp/recipes-kernel/linux/linux-fslc/glowforge.cfg
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -j"$(nproc)" modules_prepare

      # KBUILD_MODPOST_WARN: a modules_prepare tree has no Module.symvers,
      # so exported-symbol resolution is deferred to the image build; the
      # C compile itself stays -Werror.
      - name: Build the module (KCFLAGS=-Werror)
        run: |
          cd module
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- \
            KERNEL_SRC="$GITHUB_WORKSPACE/kernel" \
            KCFLAGS=-Werror KBUILD_MODPOST_WARN=1
          ls -la glowforge.ko
